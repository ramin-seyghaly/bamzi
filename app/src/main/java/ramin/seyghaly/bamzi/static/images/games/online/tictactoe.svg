<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="ttt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#7E30E1" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="300" height="200" fill="url(#ttt-bg)" />
  <!-- Grid Lines with Clay Round Ends -->
  <g stroke="#4B5563" stroke-width="8" stroke-linecap="round">
    <line x1="110" y1="35" x2="110" y2="165" />
    <line x1="190" y1="35" x2="190" y2="165" />
    <line x1="45" y1="80" x2="255" y2="80" />
    <line x1="45" y1="125" x2="255" y2="125" />
  </g>
  <!-- Glowing 3D X Symbol -->
  <g transform="translate(60, 42)" filter="url(#neon-glow)" stroke="#9E54FF" stroke-width="12" stroke-linecap="round">
    <line x1="0" y1="0" x2="32" y2="30" />
    <line x1="32" y1="0" x2="0" y2="30" />
  </g>
  <g transform="translate(135, 87)" stroke="#A78BFA" stroke-width="12" stroke-linecap="round">
    <line x1="0" y1="0" x2="30" y2="30" />
    <line x1="30" y1="0" x2="0" y2="30" />
  </g>
  <!-- 3D O Ring -->
  <g transform="translate(205, 42)">
    <circle cx="18" cy="15" r="18" fill="none" stroke="#10B981" stroke-width="10" />
  </g>
  <g transform="translate(60, 130)">
    <circle cx="18" cy="15" r="18" fill="none" stroke="#F59E0B" stroke-width="10" />
  </g>
</svg>
