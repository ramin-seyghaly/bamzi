<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="sc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#064E3B" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#sc-bg)" />
  <g transform="translate(100, 100)" filter="url(#sc-shadow)">
    <!-- Board Base -->
    <rect x="-70" y="-55" width="140" height="110" rx="20" fill="#064E3B" />
    <!-- Left Display (Player 1) -->
    <rect x="-60" y="-45" width="54" height="75" rx="14" fill="#022C22" />
    <text x="-33" y="10" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#34D399" text-anchor="middle">3</text>
    <!-- Right Display (Player 2) -->
    <rect x="6" y="-45" width="54" height="75" rx="14" fill="#022C22" />
    <text x="33" y="10" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#F87171" text-anchor="middle">1</text>
    <!-- Colon Dots -->
    <circle cx="0" cy="-15" r="3" fill="#FFF" />
    <circle cx="0" cy="-5" r="3" fill="#FFF" />
    <!-- Subtitle / vs -->
    <text x="0" y="44" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#A7F3D0" text-anchor="middle" letter-spacing="2">VS</text>
  </g>
</svg>
