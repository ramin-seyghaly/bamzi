<!-- مودال ورود کاربر (Login Modal) -->
<div class="clay-modal-backdrop" id="loginModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
    <div class="clay-modal">
        <button type="button" class="clay-modal-close" data-close-modal="loginModalBackdrop" aria-label="بستن پنجره">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="clay-modal-header">
            <h3 class="clay-modal-title" id="loginModalTitle">ورود به حساب بامزی</h3>
            <p class="clay-modal-subtitle">برای شرکت در بازی‌های آنلاین و ثبت ریتینگ وارد شوید</p>
        </div>

        <form id="loginForm" method="post" action="/api/accounts/login/">
            {% csrf_token %}
            <div class="clay-form-group">
                <label for="loginUsername" class="clay-form-label">نام کاربری یا ایمیل</label>
                <input type="text" id="loginUsername" name="username" required class="clay-form-input" placeholder="نام کاربری خود را وارد کنید...">
            </div>

            <div class="clay-form-group">
                <label for="loginPassword" class="clay-form-label">رمز عبور</label>
                <input type="password" id="loginPassword" name="password" required class="clay-form-input" placeholder="••••••••">
            </div>

            <button type="submit" class="clay-btn clay-btn-primary" style="width: 100%; margin-top: 10px;">
                ورود به حساب
            </button>
        </form>

        <div class="clay-modal-footer">
            حساب کاربری ندارید؟ <a href="#" id="switchToRegister">همین حالا ثبت‌نام کنید</a>
        </div>
    </div>
</div>

<!-- مودال ثبت‌نام کاربر جدید (Register Modal) -->
<div class="clay-modal-backdrop" id="registerModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="registerModalTitle">
    <div class="clay-modal">
        <button type="button" class="clay-modal-close" data-close-modal="registerModalBackdrop" aria-label="بستن پنجره">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>

        <div class="clay-modal-header">
            <h3 class="clay-modal-title" id="registerModalTitle">عضویت در پلتفرم بامزی</h3>
            <p class="clay-modal-subtitle">به جمع هزاران بازیکن آنلاین و جامعه گیمرهای بامزی بپیوندید</p>
        </div>

        <form id="registerForm" method="post" action="/api/accounts/register/">
            {% csrf_token %}
            <div class="clay-form-group">
                <label for="regUsername" class="clay-form-label">نام کاربری دلخواه</label>
                <input type="text" id="regUsername" name="username" required class="clay-form-input" placeholder="مثال: gamer_pro">
            </div>

            <div class="clay-form-group">
                <label for="regEmail" class="clay-form-label">آدرس ایمیل</label>
                <input type="email" id="regEmail" name="email" required class="clay-form-input" placeholder="email@example.com">
            </div>

            <div class="clay-form-group">
                <label for="regPassword" class="clay-form-label">رمز عبور</label>
                <input type="password" id="regPassword" name="password" required class="clay-form-input" placeholder="حداقل ۸ کاراکتر">
            </div>

            <button type="submit" class="clay-btn clay-btn-primary" style="width: 100%; margin-top: 10px;">
                ایجاد حساب و شروع بازی
            </button>
        </form>

        <div class="clay-modal-footer">
            قبلاً ثبت‌نام کرده‌اید؟ <a href="#" id="switchToLogin">وارد شوید</a>
        </div>
    </div>
</div>
