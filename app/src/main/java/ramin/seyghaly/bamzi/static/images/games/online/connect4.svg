<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="c4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="c4-board" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="c4-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="300" height="200" fill="url(#c4-bg)" />
  <!-- 3D Connect 4 Board Stand -->
  <g transform="translate(45, 25)" filter="url(#c4-shadow)">
    <!-- Blue Grid Frame -->
    <rect x="0" y="10" width="210" height="140" rx="20" fill="url(#c4-board)" />
    <!-- Stand feet -->
    <path d="M-15 150 L20 150 L10 130 Z" fill="#1E40AF" />
    <path d="M190 130 L200 150 L225 150 Z" fill="#1E40AF" />
    <!-- Inner slots (Holes with coins) -->
    <!-- Row 1 -->
    <circle cx="35" cy="40" r="16" fill="#1E293B" />
    <circle cx="75" cy="40" r="16" fill="#EF4444" />
    <circle cx="115" cy="40" r="16" fill="#FBBF24" />
    <circle cx="155" cy="40" r="16" fill="#EF4444" />
    <circle cx="175" cy="40" r="16" fill="#1E293B" opacity="0.3"/>

    <!-- Row 2 -->
    <circle cx="35" cy="80" r="16" fill="#FBBF24" />
    <circle cx="75" cy="80" r="16" fill="#EF4444" />
    <circle cx="115" cy="80" r="16" fill="#EF4444" />
    <circle cx="155" cy="80" r="16" fill="#FBBF24" />

    <!-- Row 3 -->
    <circle cx="35" cy="120" r="16" fill="#EF4444" />
    <circle cx="75" cy="120" r="16" fill="#FBBF24" />
    <circle cx="115" cy="120" r="16" fill="#FBBF24" />
    <circle cx="155" cy="120" r="16" fill="#EF4444" />
  </g>
  <!-- Floating Falling Disc -->
  <g transform="translate(195, 10)">
    <circle cx="20" cy="15" r="18" fill="#FBBF24" />
    <circle cx="20" cy="15" r="12" fill="#F59E0B" />
  </g>
</svg>
