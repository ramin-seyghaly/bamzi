<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <linearGradient id="bamzi-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D46B9" />
      <stop offset="50%" stop-color="#1F0C5E" />
      <stop offset="100%" stop-color="#10043B" />
    </linearGradient>
    <filter id="clay-logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#10043B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 3D Clay Icon (Game Controller + Die) -->
  <g transform="translate(10, 8)" filter="url(#clay-logo-shadow)">
    <!-- Soft Clay Rounded Square -->
    <rect x="0" y="0" width="54" height="54" rx="18" fill="url(#bamzi-purple-grad)" />
    <!-- Inset Highlights -->
    <rect x="2" y="2" width="50" height="24" rx="16" fill="white" opacity="0.22" />
    <!-- Gamepad / Joy D-pad in Clay White -->
    <path d="M21 17 H33 V23 H39 V31 H33 V37 H21 V31 H15 V23 H21 Z" fill="#FFFFFF" rx="4" />
    <!-- D-pad buttons dots -->
    <circle cx="27" cy="27" r="2.5" fill="#1F0C5E" />
    <circle cx="43" cy="18" r="2.5" fill="#FFE169" />
    <circle cx="45" cy="36" r="2" fill="#10B981" />
  </g>

  <!-- Typography: فارسی "بامزی" و انگلیسی "BAMZI" -->
  <text x="76" y="42" font-family="'Vazirmatn', sans-serif" font-weight="900" font-size="34" fill="#1F0C5E" letter-spacing="-0.5">بامزی</text>
  <text x="174" y="27" font-family="'Outfit', sans-serif" font-weight="800" font-size="11" fill="#10043B" letter-spacing="3" opacity="0.85">GAMES</text>
  <text x="174" y="41" font-family="'Outfit', sans-serif" font-weight="700" font-size="10" fill="#2D46B9" letter-spacing="1.5">BAMZI</text>
</svg>
