<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="chess-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10043B" />
      <stop offset="60%" stop-color="#0A0624" />
      <stop offset="100%" stop-color="#050314" />
    </linearGradient>
    <linearGradient id="chess-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="chess-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="300" height="200" fill="url(#chess-bg)" />
  <!-- Stylized board tiles pattern in perspective -->
  <g opacity="0.15">
    <polygon points="20,180 280,180 220,110 80,110" fill="#1F0C5E" />
    <line x1="85" y1="110" x2="35" y2="180" stroke="#FFF" stroke-width="2"/>
    <line x1="120" y1="110" x2="90" y2="180" stroke="#FFF" stroke-width="2"/>
    <line x1="150" y1="110" x2="150" y2="180" stroke="#FFF" stroke-width="2"/>
    <line x1="180" y1="110" x2="210" y2="180" stroke="#FFF" stroke-width="2"/>
    <line x1="215" y1="110" x2="265" y2="180" stroke="#FFF" stroke-width="2"/>
  </g>
  <!-- 3D Clay Chess Knight & King -->
  <g filter="url(#chess-shadow)">
    <!-- White King -->
    <path d="M125 155 L175 155 L165 135 L160 85 L140 85 L135 135 Z" fill="#F3F8FF" />
    <circle cx="150" cy="72" r="14" fill="#F3F8FF" />
    <!-- Cross on crown -->
    <rect x="147" y="44" width="6" height="18" fill="#F3F8FF" rx="2"/>
    <rect x="141" y="49" width="18" height="6" fill="#F3F8FF" rx="2"/>
    <!-- Gold highlight ring -->
    <rect x="136" y="86" width="28" height="6" fill="url(#chess-gold)" rx="3" />

    <!-- Blue/Dark Knight on left -->
    <path d="M75 155 L120 155 L115 138 C115 138 125 110 110 95 C98 84 85 92 85 92 C85 92 80 80 95 70 C80 72 70 85 70 100 C70 112 65 115 65 125 L85 138 Z" fill="#2D46B9" />
    <circle cx="82" cy="92" r="3" fill="#FFF" />
  </g>
  <!-- Ambient glow particles -->
  <circle cx="230" cy="50" r="4" fill="#FFE169" opacity="0.8" />
  <circle cx="50" cy="40" r="3" fill="#3D64FF" opacity="0.6" />
  <circle cx="250" cy="140" r="5" fill="#1F0C5E" opacity="0.7" />
</svg>
