<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="coin-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="coin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="7" stdDeviation="5" flood-color="#10043B" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="30" fill="#10043B" />
  <!-- 3D Gold Coin with Clay Depth -->
  <g transform="translate(100, 100)" filter="url(#coin-shadow)">
    <!-- Outer Rim -->
    <circle cx="0" cy="0" r="62" fill="#B45309" />
    <circle cx="0" cy="-3" r="60" fill="url(#coin-gold)" />
    <!-- Inner concentric bead ring -->
    <circle cx="0" cy="-3" r="48" fill="none" stroke="#FDE68A" stroke-width="3" stroke-dasharray="6,4"/>
    <!-- Center Star / Crown -->
    <polygon points="0,-22 7,-6 24,-6 10,5 15,22 0,11 -15,22 -10,5 -24,-6 -7,-6" fill="#FFF" />
  </g>
</svg>
