<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="dice-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="dice-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#49108B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="30" fill="#7E30E1" />
  <!-- 3D Clay White Die -->
  <g transform="translate(45, 45)" filter="url(#dice-shadow)">
    <rect width="110" height="110" rx="26" fill="url(#dice-grad)" />
    <!-- Inset border highlight -->
    <rect x="3" y="3" width="104" height="104" rx="24" fill="none" stroke="#FFF" stroke-width="3" opacity="0.8"/>
    <!-- Dots (Showing 5) in Deep Purple #49108B -->
    <circle cx="28" cy="28" r="10" fill="#49108B" />
    <circle cx="82" cy="28" r="10" fill="#49108B" />
    <circle cx="55" cy="55" r="11" fill="#7E30E1" />
    <circle cx="28" cy="82" r="10" fill="#49108B" />
    <circle cx="82" cy="82" r="10" fill="#49108B" />
  </g>
</svg>
