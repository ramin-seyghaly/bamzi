<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="timer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="timer-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#082F49" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#timer-bg)" />
  <g transform="translate(100, 110)" filter="url(#timer-shadow)">
    <!-- Top button -->
    <rect x="-10" y="-72" width="20" height="14" rx="4" fill="#E0F2FE" />
    <rect x="-16" y="-76" width="32" height="6" rx="3" fill="#BAE6FD" />
    <!-- Clock Body -->
    <circle cx="0" cy="0" r="54" fill="#F8FAFC" />
    <circle cx="0" cy="0" r="46" fill="#0C4A6E" />
    <!-- Dial ticks -->
    <circle cx="0" cy="-38" r="3" fill="#38BDF8" />
    <circle cx="38" cy="0" r="3" fill="#38BDF8" />
    <circle cx="0" cy="38" r="3" fill="#38BDF8" />
    <circle cx="-38" cy="0" r="3" fill="#38BDF8" />
    <!-- Hands -->
    <line x1="0" y1="0" x2="0" y2="-28" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="0" x2="22" y2="10" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="0" r="5" fill="#EF4444" />
  </g>
</svg>
