<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <linearGradient id="sudoku-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#sudoku-bg)" />
  <!-- Sudoku Grid in Clay Glass Card -->
  <rect x="70" y="20" width="160" height="160" rx="18" fill="#334155" opacity="0.6" />
  <g fill="#F8FAFC" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" text-anchor="middle">
    <!-- Row 1 -->
    <text x="100" y="60">5</text>
    <text x="150" y="60" fill="#2D46B9">3</text>
    <text x="200" y="60">7</text>
    <!-- Row 2 -->
    <text x="100" y="110" fill="#10B981">6</text>
    <rect x="135" y="85" width="30" height="30" rx="8" fill="#1F0C5E" />
    <text x="150" y="108" fill="#FFF">9</text>
    <text x="200" y="110">1</text>
    <!-- Row 3 -->
    <text x="100" y="160">8</text>
    <text x="150" y="160">4</text>
    <text x="200" y="160" fill="#F59E0B">2</text>
  </g>
  <!-- Thin grid lines -->
  <line x1="125" y1="30" x2="125" y2="170" stroke="#475569" stroke-width="2" />
  <line x1="175" y1="30" x2="175" y2="170" stroke="#475569" stroke-width="2" />
  <line x1="80" y1="75" x2="220" y2="75" stroke="#475569" stroke-width="2" />
  <line x1="80" y1="125" x2="220" y2="125" stroke="#475569" stroke-width="2" />
</svg>
